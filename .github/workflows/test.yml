name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # ffmpeg's VERSION is pinned by the runner image (ubuntu-24.04 -> 6.1.1), not by apt, which
      # offers only one. That pin is deliberate: the seam metrics in test/integration/seamstitch-cli
      # are decoded-pixel measurements that move by ~1 luma between ffmpeg 6 and 8 — enough to flip
      # §9's gate — so `ubuntu-latest` silently rolling to the next LTS would change what CI measures.
      # 24.04 is also what Ubuntu LTS users actually run, so CI matches the common deployment.
      # Reproduce a CI-identical box locally with:
      #   docker run --rm -v "$PWD":/w -w /w ubuntu:24.04 \
      #     bash -c 'apt-get update && apt-get install -y ffmpeg python3-numpy python3-pil nodejs npm && node --test test/integration/seamstitch-cli.test.js'
      - name: Install ffmpeg (for assembly tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The seamless stitcher (tools/seamstitch) is OPTIONAL: without numpy/pillow its tests skip and
      # assembly falls back to a hard-cut stitch. Every step below is continue-on-error so a bad day
      # on PyPI degrades the run to "skipped", never to "failed" — that is the product behaviour too.
      - uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/seamstitch/requirements.txt

      - name: Install the seamless stitcher's deps (optional)
        continue-on-error: true
        run: python3 -m pip install -r tools/seamstitch/requirements.txt

      - name: Byte-compile the seamless stitcher (optional)
        continue-on-error: true
        run: python3 -m compileall -q tools/seamstitch

      - name: Install dependencies
        run: npm ci   # package-lock.json (v3) is committed

      - name: Syntax-check all sources
        run: find config.js src web/server -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        env:
          CI: "true"
          # Defense in depth: the suite points transports at localhost mocks and injects a fake LLM,
          # so no real API is contacted and no money is spent. RUN_LIVE is intentionally unset here.
        run: npm test

  web-server:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install ffmpeg (integration tests stitch real clips)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies (root + server)
        run: |
          npm ci
          npm --prefix web/server ci
      - name: Server tests (node:test — unit + integration over the real CLIs)
        env:
          CI: "true"
        run: npm --prefix web/server test

  web-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm --prefix web/ui ci
      - name: Typecheck
        run: npm --prefix web/ui run typecheck
      - name: Component tests (vitest)
        env:
          CI: "true"
        run: npm --prefix web/ui test
      - name: Production build
        run: npm --prefix web/ui run build

  web-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install ffmpeg (the demo server stitches real clips)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web/server ci
          npm --prefix web/ui ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/ui/package-lock.json') }}
      - name: Install chromium
        run: npm --prefix web/ui exec playwright install --with-deps chromium
      - name: Build the UI (the demo server serves dist/)
        run: npm --prefix web/ui run build
      - name: e2e (Playwright vs the zero-spend demo server)
        env:
          CI: "true"
        run: npm --prefix web/ui run e2e
